<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2000" viewBox="0 0 1600 2000" role="img" aria-labelledby="title desc">
  <title id="title">Skills package index</title>
  <desc id="desc">A visual index of six packages and fourteen skills: harness for the setup an agent works in, conductor for coordinating parallel agents, misc for cross-cutting project judgment, plugin-ops for marketplace maintenance, prompt-tuning for prompt cache efficiency, and memory-mood for emotional-arc visualization.</desc>
  <style>
    .sans { font-family: Helvetica, Arial, sans-serif; }
    .mono { font-family: Menlo, Consolas, monospace; }
  </style>
  <rect width="1600" height="2000" fill="#f7f6f2"/>

  <text class="mono" x="120" y="112" font-size="22" fill="#42647a">SKILLS</text>
  <text class="sans" x="1480" y="112" font-size="22" fill="#51514d" text-anchor="end">PACKAGE INDEX</text>
  <line x1="120" y1="146" x2="1480" y2="146" stroke="#d1d0ca" stroke-width="2"/>

  <g transform="translate(120 258)">
    <text class="sans" x="0" y="0" font-size="88" font-weight="700" fill="#181816">Package index</text>
    <text class="sans" x="0" y="80" font-size="34" fill="#51514d">6 packages · 14 skills</text>
  </g>

  <g transform="translate(120 460)">
    <text class="sans" x="0" y="0" font-size="23" font-weight="700" letter-spacing="1.4" fill="#51514d">PACKAGE</text>
    <text class="sans" x="320" y="0" font-size="23" font-weight="700" letter-spacing="1.4" fill="#51514d">SCOPE</text>
    <text class="sans" x="1030" y="0" font-size="23" font-weight="700" letter-spacing="1.4" fill="#51514d">SKILLS COVER</text>
    <line x1="0" y1="34" x2="1360" y2="34" stroke="#181816" stroke-width="3"/>

    <g transform="translate(0 78)">
      <text class="mono" x="0" y="34" font-size="28" font-weight="700" fill="#181816">HARNESS</text>
      <text class="sans" x="0" y="72" font-size="24" fill="#42647a">3 skills</text>
      <text class="sans" x="320" y="26" font-size="28" font-weight="700" fill="#181816">Sets up the repo an agent works in,</text>
      <text class="sans" x="320" y="66" font-size="28" font-weight="700" fill="#181816">and keeps it that way.</text>
      <text class="sans" x="1030" y="26" font-size="24" fill="#51514d">Day-zero bootstrap</text>
      <text class="sans" x="1030" y="62" font-size="24" fill="#51514d">Memory curation</text>
      <text class="sans" x="1030" y="98" font-size="24" fill="#51514d">Setup repair</text>
      <line x1="0" y1="150" x2="1360" y2="150" stroke="#d1d0ca" stroke-width="2"/>
    </g>

    <g transform="translate(0 293)">
      <text class="mono" x="0" y="34" font-size="28" font-weight="700" fill="#181816">CONDUCTOR</text>
      <text class="sans" x="0" y="72" font-size="24" fill="#42647a">2 skills · 5 agents</text>
      <text class="sans" x="320" y="26" font-size="28" font-weight="700" fill="#181816">Coordinates coding agents across</text>
      <text class="sans" x="320" y="66" font-size="28" font-weight="700" fill="#181816">parallel owned work.</text>
      <text class="sans" x="1030" y="26" font-size="24" fill="#51514d">Delegation and plan gates</text>
      <text class="sans" x="1030" y="62" font-size="24" fill="#51514d">Review by blast radius</text>
      <text class="sans" x="1030" y="98" font-size="24" fill="#51514d">Integration seam tracing</text>
      <line x1="0" y1="150" x2="1360" y2="150" stroke="#d1d0ca" stroke-width="2"/>
    </g>

    <g transform="translate(0 508)">
      <text class="mono" x="0" y="34" font-size="28" font-weight="700" fill="#181816">MISC</text>
      <text class="sans" x="0" y="72" font-size="24" fill="#42647a">3 skills</text>
      <text class="sans" x="320" y="26" font-size="28" font-weight="700" fill="#181816">The judgment calls around</text>
      <text class="sans" x="320" y="66" font-size="28" font-weight="700" fill="#181816">AI-assisted product work.</text>
      <text class="sans" x="1030" y="26" font-size="24" fill="#51514d">Prior art before building</text>
      <text class="sans" x="1030" y="62" font-size="24" fill="#51514d">Naming against standards</text>
      <text class="sans" x="1030" y="98" font-size="24" fill="#51514d">Customer-facing copy</text>
      <line x1="0" y1="150" x2="1360" y2="150" stroke="#d1d0ca" stroke-width="2"/>
    </g>

    <g transform="translate(0 723)">
      <text class="mono" x="0" y="34" font-size="28" font-weight="700" fill="#181816">PLUGIN-OPS</text>
      <text class="sans" x="0" y="72" font-size="24" fill="#42647a">3 skills</text>
      <text class="sans" x="320" y="26" font-size="28" font-weight="700" fill="#181816">Keeps this marketplace's own</text>
      <text class="sans" x="320" y="66" font-size="28" font-weight="700" fill="#181816">skills honest.</text>
      <text class="sans" x="1030" y="26" font-size="24" fill="#51514d">Stale-claim refresh</text>
      <text class="sans" x="1030" y="62" font-size="24" fill="#51514d">Manifest validation</text>
      <text class="sans" x="1030" y="98" font-size="24" fill="#51514d">Pre-publish leak gate</text>
      <line x1="0" y1="150" x2="1360" y2="150" stroke="#d1d0ca" stroke-width="2"/>
    </g>

    <g transform="translate(0 938)">
      <text class="mono" x="0" y="34" font-size="28" font-weight="700" fill="#181816">PROMPT-TUNING</text>
      <text class="sans" x="0" y="72" font-size="24" fill="#42647a">1 skill</text>
      <text class="sans" x="320" y="26" font-size="28" font-weight="700" fill="#181816">Makes repeated prompts</text>
      <text class="sans" x="320" y="66" font-size="28" font-weight="700" fill="#181816">cheaper and faster.</text>
      <text class="sans" x="1030" y="26" font-size="24" fill="#51514d">Cache hit rate</text>
      <text class="sans" x="1030" y="62" font-size="24" fill="#51514d">Prefix and breakpoint design</text>
      <text class="sans" x="1030" y="98" font-size="24" fill="#51514d">Cost-spike diagnosis</text>
      <line x1="0" y1="150" x2="1360" y2="150" stroke="#d1d0ca" stroke-width="2"/>
    </g>

    <g transform="translate(0 1153)">
      <text class="mono" x="0" y="34" font-size="28" font-weight="700" fill="#181816">MEMORY-MOOD</text>
      <text class="sans" x="0" y="72" font-size="24" fill="#42647a">2 skills</text>
      <text class="sans" x="320" y="26" font-size="28" font-weight="700" fill="#181816">Shows an assistant's memory</text>
      <text class="sans" x="320" y="66" font-size="28" font-weight="700" fill="#181816">as an emotional arc.</text>
      <text class="sans" x="1030" y="26" font-size="24" fill="#51514d">Cumulative snapshot replay</text>
      <text class="sans" x="1030" y="62" font-size="24" fill="#51514d">Mood chart over time</text>
      <text class="sans" x="1030" y="98" font-size="24" fill="#51514d">Timestamped reaction feed</text>
    </g>
  </g>

  <line x1="120" y1="1876" x2="1480" y2="1876" stroke="#d1d0ca" stroke-width="2"/>
  <text class="sans" x="120" y="1926" font-size="24" fill="#51514d">Claude Code plugin marketplace</text>
  <text class="mono" x="1480" y="1926" font-size="24" fill="#42647a" text-anchor="end">/plugin marketplace add UnderMyBed/Skills</text>
</svg>
